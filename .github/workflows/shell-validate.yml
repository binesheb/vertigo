name: Shell validation

on:
  push:
    branches: [main]
    paths:
      - '**/*.sh'
      - '.github/workflows/shell-validate.yml'
  pull_request:
    branches: [main]
    paths:
      - '**/*.sh'
      - '.github/workflows/shell-validate.yml'

permissions:
  contents: read

concurrency:
  group: shell-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bash-syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate shell syntax
        run: |
          while IFS= read -r -d '' script; do
            bash -n "$script"
          done < <(find . -type f -name '*.sh' -not -path './.git/*' -print0)
      - name: Validate updater safety invariants
        run: |
          updater="scripts/self_update.sh"
          test -x "$updater"
          grep -Fq '#!/usr/bin/env bash' "$updater"
          grep -Fq 'git -C "$TARGET" status --porcelain' "$updater"
          grep -Fq 'commit, stash, or back up them before updating.' "$updater"
          grep -Fq 'CURRENT="$(git -C "$TARGET" rev-parse HEAD 2>/dev/null || true)"' "$updater"
          grep -Fq 'CANDIDATE="$(git -C "$TMP_DIR/vertigo" rev-parse HEAD)"' "$updater"
          grep -Fq '[[ -n "$CURRENT" && "$CURRENT" == "$CANDIDATE" ]]' "$updater"
          grep -Fq 'sudo mv "$TARGET" "$BACKUP"' "$updater"
          grep -Fq 'sudo mv "$BACKUP" "$TARGET"' "$updater"
